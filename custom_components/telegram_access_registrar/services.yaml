approve:
  name: Approve registration
  description: Approve a pending Telegram registration by its numeric chat ID.
  fields:
    chat_id:
      required: true
      selector:
        number:
          mode: box
list_request_log:
  name: List SmartHouse requests
  description: Read inbound messages and button presses outside the administrator chat. Home Assistant administrators only.
  fields:
    limit:
      default: 25
      selector:
        number:
          min: 1
          max: 100
          mode: box
    before_id:
      selector:
        text:
    chat_id:
      selector:
        text:
reject:
  name: Reject registration
  description: Reject a pending Telegram registration by its numeric chat ID.
  fields:
    chat_id:
      required: true
      selector:
        number:
          mode: box
list_requests:
  name: List registrations
  description: Return pending and approved registrations without exposing the bot token.
send_message:
  name: Send approved recipient a message
  description: Send a message only to an approved username.
  fields:
    username:
      required: true
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
